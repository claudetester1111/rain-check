<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rain Check">
<title>Rain Check</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 16px;
         background: #f4f6f8; color: #1d2530; text-align: center; }
  .card { background: #fff; border-radius: 16px; padding: 20px; margin: 0 auto 16px;
          max-width: 420px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  #date { font-weight: 600; }
  #place { opacity: .75; margin-bottom: 8px; }
  #emoji { font-size: 72px; }
  #verdict { font-size: 28px; font-weight: 700; margin: 8px 0; }
  #detail { opacity: .75; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  td { padding: 4px 0; font-size: 15px; }
  td.time { width: 60px; }
  td.pct { width: 48px; text-align: right; }
  td.mm { width: 40px; text-align: right; }
  th { font-size: 12px; font-weight: 600; opacity: .6; padding-bottom: 6px; }
  th.right { text-align: right; }
  .bar-bg { background: #e3e8ee; border-radius: 4px; height: 10px; margin: 0 8px; }
  .bar { background: #3b82f6; height: 10px; border-radius: 4px; }
  tr.ride td { font-weight: 700; }
  small { opacity: .6; }
  /* Dark mode: follows your phone's setting */
  @media (prefers-color-scheme: dark) {
    body { background: #12161c; color: #e8edf2; }
    .card { background: #1c232c; }
    .bar-bg { background: #2a333e; }
  }
</style>
</head>
<body>

<div class="card">
  <div id="date"></div>
  <div id="place">📍 Finding you…</div>
  <div id="emoji">⏳</div>
  <div id="verdict">Checking the sky…</div>
  <div id="detail"></div>
</div>

<div class="card">
  <table id="hours"></table>
</div>

<small id="updated"></small>

<script>
// ---------- Settings you can change ----------
const MORNING = [7, 8];    // hours of your ride to work (24-hour clock)
const EVENING = [17, 18];  // hours of your ride home
const FALLBACK = { lat: -40.88, lon: 175.07, name: "Waikanae (default)" }; // used if phone location is unavailable
const SWITCH_HOUR = 19;    // from 7pm onwards, show tomorrow's forecast
const WEATHERAPI_KEY = "029aab996f564441b0a103327261811";  // your free key from weatherapi.com

// Work out which day to forecast: today, or tomorrow if it's evening
const forecastDay = new Date();
const isTomorrow = forecastDay.getHours() >= SWITCH_HOUR;
if (isTomorrow) forecastDay.setDate(forecastDay.getDate() + 1);

// The forecast day as text like "2026-09-27", to match the forecast times
const pad = n => String(n).padStart(2, "0");
const forecastDateText =
  `${forecastDay.getFullYear()}-${pad(forecastDay.getMonth() + 1)}-${pad(forecastDay.getDate())}`;

// Show the forecast day's date and which day of the year it is
function showDate() {
  const d = forecastDay;
  const pretty = d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  const thisDay = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const jan1 = Date.UTC(d.getFullYear(), 0, 1);
  const dayOfYear = (thisDay - jan1) / 86400000 + 1;   // 86,400,000 milliseconds in a day
  const label = isTomorrow ? "Tomorrow: " : "Today: ";
  document.getElementById("date").textContent = `${label}${pretty} · Day ${dayOfYear}`;
}

// Turn coordinates into a place name, e.g. "Riccarton"
async function getPlaceName(lat, lon) {
  try {
    const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client` +
                            `?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const place = await res.json();
    return place.locality || place.city || "your area";
  } catch {
    return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;   // if it fails, just show the numbers
  }
}

// Ask the phone where it is; fall back to FALLBACK if that fails
function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(FALLBACK);
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
      () => resolve(FALLBACK),
      { timeout: 8000, maximumAge: 3600000 }
    );
  });
}

// ---------- Weather services ----------
// Each one returns the same shape, so the rest of the app doesn't care which was used:
// { source, times: ["2026-11-19T07:00", ...], probs: [chance %], rain: [mm] }

// Main service: WeatherAPI.com (free account and key)
async function fromWeatherAPI(lat, lon) {
  if (WEATHERAPI_KEY.startsWith("PASTE")) throw new Error("No WeatherAPI key yet");
  const url = `https://api.weatherapi.com/v1/forecast.json?key=${WEATHERAPI_KEY}` +
              `&q=${lat},${lon}&days=2`;                           // today and tomorrow
  const res = await fetch(url, { signal: AbortSignal.timeout(8000) });  // give up after 8 seconds
  if (!res.ok) throw new Error("WeatherAPI unavailable");
  const data = await res.json();

  const hours = data.forecast.forecastday.flatMap(day => day.hour);   // both days, joined into one list
  return {
    source: "WeatherAPI.com",
    times: hours.map(h => h.time.replace(" ", "T")),   // "2026-11-19 07:00" -> "2026-11-19T07:00"
    probs: hours.map(h => h.chance_of_rain),
    rain:  hours.map(h => h.precip_mm),
  };
}

// Backup service: Open-Meteo (no key needed, but sometimes down)
async function fromOpenMeteo(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
              `&hourly=precipitation_probability,precipitation&timezone=auto&forecast_days=2`;
  const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
  if (!res.ok) throw new Error("Open-Meteo unavailable");
  const data = await res.json();
  return {
    source: "Open-Meteo",
    times: data.hourly.time,
    probs: data.hourly.precipitation_probability,
    rain:  data.hourly.precipitation,
  };
}

// Try the main service first; if it fails, try the backup
async function getForecast(lat, lon) {
  try {
    return await fromWeatherAPI(lat, lon);
  } catch (problem) {
    console.log("WeatherAPI failed, trying Open-Meteo:", problem.message);
    return await fromOpenMeteo(lat, lon);
  }
}

async function checkRain() {
  const { lat, lon, name } = await getLocation();

  // Show the place name (without waiting for it before getting the forecast)
  const placeBox = document.getElementById("place");
  if (name) {
    placeBox.textContent = "📍 " + name;
  } else {
    getPlaceName(lat, lon).then(found => placeBox.textContent = "📍 " + found);
  }

  const { source, times, probs, rain } = await getForecast(lat, lon);
  const rideHours = [...MORNING, ...EVENING];

  let worst = 0;
  let rows = `<tr><th>Time</th><th class="right">mm</th><th class="right">Likelihood</th><th class="right">%</th></tr>`;
  times.forEach((t, i) => {
    if (!t.startsWith(forecastDateText)) return;       // skip hours from the other day
    const hour = Number(t.slice(11, 13));
    if (hour < 6 || hour > 20) return;                 // only show 6am to 8pm
    const p = probs[i] ?? 0;
    const mm = rain[i] ?? 0;
    const isRide = rideHours.includes(hour);
    if (isRide) worst = Math.max(worst, p);
    rows += `<tr class="${isRide ? "ride" : ""}">
      <td class="time">${hour}:00</td>
      <td class="mm">${mm.toFixed(1)}</td>
      <td><div class="bar-bg"><div class="bar" style="width:${p}%"></div></div></td>
      <td class="pct">${p}%</td></tr>`;
  });
  document.getElementById("hours").innerHTML = rows;

  // The decision
  let emoji, verdict;
  if (worst < 20)      { emoji = "🏍️"; verdict = "Clear skies – get the bike out!"; }
  else if (worst < 50) { emoji = "🌦️"; verdict = "It may rain – use waterproofs"; }
  else                 { emoji = "🏠"; verdict = "Rain likely – work from home"; }

  document.getElementById("emoji").textContent = emoji;
  document.getElementById("verdict").textContent = verdict;
  document.getElementById("detail").textContent =
    `Highest chance of rain during your rides: ${worst}%`;
  document.getElementById("updated").textContent =
    "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
    " · Bold rows are your ride times · Forecast by " + source;
}

showDate();
checkRain().catch(() => {
  document.getElementById("emoji").textContent = "⚠️";
  document.getElementById("verdict").textContent = "Couldn't get the forecast";
  document.getElementById("detail").textContent = "Both weather services failed. Check your internet connection and reload.";
});
</script>
</body>
</html>
